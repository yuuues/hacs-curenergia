name: lib

on:
  push:
    paths: ["lib/**", ".github/workflows/lib.yml"]
  pull_request:
    paths: ["lib/**", ".github/workflows/lib.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --locked --directory lib ruff check .
      - run: uv run --locked --directory lib pytest -v

  # Home Assistant puede instalar un pypdf más antiguo que el de uv.lock: los
  # tests se pasan también con el mínimo declarado en lib/pyproject.toml.
  test-min-pypdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Read the minimum pypdf from pyproject.toml
        id: min
        run: |
          version="$(python3 -c 'import re, tomllib; deps = tomllib.load(open("lib/pyproject.toml", "rb"))["project"]["dependencies"]; print(next(re.fullmatch(r"pypdf>=([\d.]+)", d).group(1) for d in deps if d.startswith("pypdf")))')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - env:
          PYPDF: ${{ steps.min.outputs.version }}
        run: uv run --locked --directory lib --with "pypdf==${PYPDF}" pytest -v
