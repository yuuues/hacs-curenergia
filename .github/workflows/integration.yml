name: integration

on:
  push:
    paths:
      - "custom_components/**"
      - "tests/**"
      - "lib/**"
      - "frontend/**"
      - "pyproject.toml"
      - "uv.lock"
      - "hacs.json"
      - ".github/workflows/integration.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "tests/**"
      - "lib/**"
      - "frontend/**"
      - "pyproject.toml"
      - "uv.lock"
      - "hacs.json"
      - ".github/workflows/integration.yml"
  workflow_dispatch:
  # Weekly run so hassfest and HACS catch upstream changes.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Documented ref is @master (the 1.0.0 tag dates from 2020); pinned to its commit of 2026-10-26.
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # brands stays ignored: the local brand/ folder exists since 0.2.0, but HACS acceptance
      # of it cannot be verified locally; remove this once the action passes without it.
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          ignore: brands
          comment: "false"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.14"
      - run: uv run --locked --group ha ruff check custom_components tests
      - run: uv run --locked --group ha ruff format --check custom_components tests
      - run: uv run --locked --group ha pytest --cov=custom_components.curenergia --cov-report=term-missing --cov-fail-under=95
      # config-flow-test-coverage (Bronze): config_flow.py at 100 %.
      - run: uv run --locked --group ha pytest tests/test_config_flow.py --cov=custom_components.curenergia.config_flow --cov-report=term-missing --cov-fail-under=100

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The bundle is versioned: fail if it is not up to date with the sources.
      - run: git diff --exit-code -- custom_components/curenergia/frontend/
        working-directory: .
